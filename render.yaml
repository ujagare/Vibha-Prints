services:
  - type: web
    name: vibha-art-backend
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: cd mcp-server-copy-20260305_131845 && pip install -r requirements.txt
    startCommand: cd mcp-server-copy-20260305_131845 && python website_bridge.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BRIDGE_ALLOWED_ORIGINS
        value: "*"
      - key: FOLLOWUP_SCHEDULER_ENABLED
        value: "true"
      - key: FOLLOWUP_SCHEDULER_TIME
        value: "09:00"
      - key: INBOUND_AUTO_REPLY_ENABLED
        value: "true"
      - key: INBOUND_EMAIL_POLL_ENABLED
        value: "true"
      - key: INBOUND_EMAIL_POLL_SECONDS
        value: "120"
      - key: SMTP_TIMEOUT_SECONDS
        value: "45"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: INBOUND_SKIP_DOMAINS
        value: zohocorp.com,zohocreator.com,zohoworkplace.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_FROM
        value: Vibha Prints <info@vibhaprints.com>
      - key: INBOUND_EMAIL_SEARCH_DAYS
        value: "7"
      - key: WHATSAPP_AUTO_REPLY_ENABLED
        value: "true"
      - key: WHATSAPP_REPLY_MODE
        value: auto
      - key: WHATSAPP_WEBSITE_AUTO_REPLY_ONLY
        value: "false"
      - key: WHATSAPP_WEBSITE_SESSION_TTL_SECONDS
        value: "86400"
      - key: WHATSAPP_MANUAL_TAKEOVER_TTL_SECONDS
        value: "86400"
