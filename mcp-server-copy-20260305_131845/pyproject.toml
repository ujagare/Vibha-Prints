[project]
name = "vibha-mcp-server"
version = "0.1.0"
description = "MCP and REST bridge automation server for Vibha Prints website leads, chat, email, WhatsApp, quotes, and social workflows."
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "fastapi>=0.110",
  "flask>=3.0",
  "google-generativeai>=0.8",
  "groq>=0.13",
  "mcp>=1.2",
  "psutil>=5.9",
  "pydantic>=2.7",
  "pymongo>=4.6",
  "python-dotenv>=1.0",
  "redis>=5.0",
  "reportlab>=4.2",
  "requests>=2.31",
  "supabase>=2.6",
  "tenacity>=8.2",
  "twilio>=9.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "locust>=2.24",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "test-*.py"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
